---
layout: null
permalink: /vault/photography.html
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>portfolio | barrettjflowers</title>
  <link rel="stylesheet" href="../style/style.css">
  <style>
    /* photography: darker, full-bleed gallery treatment */
    body.photo-page { background-image: none; background-color: #0b0d0b; }
    [data-theme="light"] body.photo-page { background-color: #ececec; }

    .photo-intro { max-width: 900px; margin: 95px auto 1rem; }
    .photo-intro h1 { margin: .25rem 0; }
    .photo-intro p { margin: 0; }

    .carousel { max-width: 1400px; margin: 0 auto; user-select: none; }
    .carousel-stage {
      position: relative;
      height: calc(100vh - 440px);
      height: calc(100dvh - 440px);
      min-height: 220px;
      display: flex; align-items: center; justify-content: center;
    }
    .carousel-stage img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      opacity: 0; transition: opacity .35s ease;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }
    .carousel-stage img.loaded { opacity: 1; }
    .carousel-btn {
      position: absolute; top: 0; bottom: 0; width: 20%;
      background: none; border: none; cursor: pointer;
      color: var(--text); font: inherit; font-size: 2rem;
      opacity: 0; transition: opacity .2s;
    }
    .carousel-stage:hover .carousel-btn { opacity: .8; }
    .carousel-btn:focus-visible { opacity: 1; }
    .carousel-btn.prev { left: 0; text-align: left; padding-left: 1rem; }
    .carousel-btn.next { right: 0; text-align: right; padding-right: 1rem; }

    .carousel-meta {
      display: flex; justify-content: space-between;
      margin: .75rem 0; font-size: .85rem; letter-spacing: .05em;
    }
    .carousel-thumbs {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px;
      scrollbar-width: thin;
    }
    .carousel-thumbs button {
      flex: 0 0 auto; width: 72px; height: 48px; padding: 0;
      border: 1px solid transparent; background: none; cursor: pointer;
      opacity: .4; transition: opacity .2s;
    }
    .carousel-thumbs button:hover { opacity: .8; }
    .carousel-thumbs button.active { opacity: 1; border-color: var(--border); }
    .carousel-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .carousel-empty { text-align: center; padding: 4rem 0; }

    @media (hover: none) { .carousel-btn { opacity: .6; } }
  </style>
</head>
<body class="photo-page">

<div class="page-header">
  <h2 class="user"><a href="../">@barrettjflowers</a></h2>
  <div class="search-container">
    <input type="search" placeholder="search" class="search" id="search-input">
    <span class="search-shortcut" id="search-shortcut"></span>
  </div>
  <p class="date"><span id="today-date"></span></p>
  <svg class="theme-toggle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="5" class="sun"></circle>
    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" class="sun"></path>
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" class="moon"></path>
  </svg>
  <hr class="divider">
</div>

<div class="photo-intro">
  <p><a href="../">← back</a></p>
  <h1>portfolio</h1>
  <p>Some of my favorite snaps.</p>
</div>

{% assign photos = site.static_files | where_exp: "f", "f.path contains '/static/photos/'" | sort: "path" %}
<script type="application/json" id="photo-data">{{ photos | map: "path" | jsonify }}</script>

<div class="carousel">
  <div class="carousel-stage">
    <img id="photo" alt="">
    <button class="carousel-btn prev" aria-label="previous photo">‹</button>
    <button class="carousel-btn next" aria-label="next photo">›</button>
  </div>
  <div class="carousel-meta">
    <span id="photo-caption"></span>
    <span id="photo-count"></span>
  </div>
  <div class="carousel-thumbs" id="photo-thumbs"></div>
</div>

<script>
  const html = document.documentElement;
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light') html.setAttribute('data-theme', savedTheme);

  const now = new Date();
  const weekday = now.toLocaleDateString('en-US', { weekday: 'short' });
  const month = now.toLocaleDateString('en-US', { month: 'long' });
  document.getElementById('today-date').textContent = `${weekday}, ${now.getDate()} ${month} ${now.getFullYear()}`;

  document.querySelector('.theme-toggle').addEventListener('click', () => {
    const current = html.getAttribute('data-theme') || 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  const searchInput = document.getElementById('search-input');
  const vaultLinks = [
    { href: "./verbose", text: "verbose.md" },
    { href: "./resume.html", text: "resume.html" },
    { href: "./bibliographia", text: "bibliographia.md" },
    { href: "./filmography", text: "filmography.md" },
    { href: "./botanicum.html", text: "botanicum.html" },
    { href: "./jw-to-markdown", text: "jw-to-markdown.md" },
    { href: "./photography.html", text: "photography.html" }
  ];

  const shortcutSpan = document.getElementById('search-shortcut');
  shortcutSpan.textContent = 'f';

  let dropdown = document.createElement('div');
  dropdown.className = 'search-dropdown';
  dropdown.style.display = 'none';
  searchInput.parentElement.appendChild(dropdown);

  let selectedIndex = -1;

  function showDropdown(items) {
    dropdown.innerHTML = '';
    selectedIndex = -1;
    if (items.length === 0) {
      dropdown.style.display = 'none';
      return;
    }
    items.forEach(item => {
      const div = document.createElement('a');
      div.className = 'search-dropdown-item';
      div.href = item.href;
      div.textContent = item.text;
      div.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = item.href;
      });
      dropdown.appendChild(div);
    });
    dropdown.style.display = 'block';
    updateSelection(getDropdownItems(), 0);
  }

  function hideDropdown() {
    dropdown.style.display = 'none';
    selectedIndex = -1;
  }

  function getDropdownItems() {
    return dropdown.querySelectorAll('.search-dropdown-item');
  }

  function updateSelection(items, newIndex) {
    items.forEach((item, i) => {
      item.classList.toggle('selected', i === newIndex);
    });
    selectedIndex = newIndex;
  }

  searchInput.addEventListener('input', () => {
    const query = searchInput.value.toLowerCase().trim();
    if (!query) {
      hideDropdown();
      return;
    }
    showDropdown(vaultLinks.filter(l => l.text.toLowerCase().includes(query)));
  });

  searchInput.addEventListener('blur', () => {
    setTimeout(hideDropdown, 150);
  });

  searchInput.addEventListener('keydown', (e) => {
    const items = getDropdownItems();
    const itemCount = items.length;
    if (e.key === 'Enter') {
      e.preventDefault();
      if (selectedIndex >= 0 && selectedIndex < itemCount) {
        window.location.href = items[selectedIndex].href;
      } else if (itemCount > 0) {
        const query = searchInput.value.toLowerCase().trim();
        const match = vaultLinks.find(l => l.text.toLowerCase().includes(query));
        if (match) window.location.href = match.href;
      }
    } else if (e.key === 'ArrowDown' || (e.ctrlKey && e.key.toLowerCase() === 'n')) {
      e.preventDefault();
      if (itemCount > 0) updateSelection(items, (selectedIndex + 1) % itemCount);
    } else if (e.key === 'ArrowUp' || (e.ctrlKey && e.key.toLowerCase() === 'p')) {
      e.preventDefault();
      if (itemCount > 0) updateSelection(items, selectedIndex <= 0 ? itemCount - 1 : selectedIndex - 1);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hideDropdown();
    if (e.key === 'f' && !e.metaKey && !e.ctrlKey && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  // Photo list is generated by Jekyll from /static/photos/ (raw Liquid when served locally).
  let photos = [];
  try { photos = JSON.parse(document.getElementById('photo-data').textContent); } catch (e) {}
  photos = photos.filter(p => /\.(jpe?g|png|gif|webp|avif)$/i.test(p));

  const stage = document.querySelector('.carousel-stage');
  const img = document.getElementById('photo');
  const caption = document.getElementById('photo-caption');
  const count = document.getElementById('photo-count');
  const thumbs = document.getElementById('photo-thumbs');
  let index = 0;

  const nameOf = p => decodeURIComponent(p.split('/').pop()).replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ');

  if (photos.length === 0) {
    document.querySelector('.carousel').innerHTML =
      '<p class="carousel-empty">no photos yet — add images to /static/photos/</p>';
  } else {
    photos.forEach((p, i) => {
      const b = document.createElement('button');
      b.setAttribute('aria-label', nameOf(p));
      b.innerHTML = `<img src="${p}" alt="" loading="lazy">`;
      b.addEventListener('click', () => show(i));
      thumbs.appendChild(b);
    });

    function show(i) {
      index = (i + photos.length) % photos.length;
      img.classList.remove('loaded');
      img.src = photos[index];
      img.alt = nameOf(photos[index]);
      caption.textContent = nameOf(photos[index]);
      count.textContent = `${index + 1} / ${photos.length}`;
      [...thumbs.children].forEach((t, j) => t.classList.toggle('active', j === index));
      thumbs.children[index].scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
      new Image().src = photos[(index + 1) % photos.length]; // preload next
      history.replaceState(null, '', '#' + (index + 1));
    }

    img.addEventListener('load', () => img.classList.add('loaded'));
    document.querySelector('.carousel-btn.prev').addEventListener('click', () => show(index - 1));
    document.querySelector('.carousel-btn.next').addEventListener('click', () => show(index + 1));

    document.addEventListener('keydown', (e) => {
      if (document.activeElement === searchInput) return;
      if (e.key === 'ArrowLeft') show(index - 1);
      if (e.key === 'ArrowRight') show(index + 1);
    });

    let touchX = null;
    stage.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
    stage.addEventListener('touchend', e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 40) show(index + (dx < 0 ? 1 : -1));
      touchX = null;
    });

    show((parseInt(location.hash.slice(1), 10) || 1) - 1);
  }
</script>

</body>
</html>
